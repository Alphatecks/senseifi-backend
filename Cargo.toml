[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.8"
dotenv = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3.22"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid", "rust_decimal"] }
rust_decimal = { version = "1.36", features = ["serde-with-str"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tower-http = { version = "0.5", features = ["cors", "set-header", "limit"] }
tower_governor = { version = "0.8", features = ["axum"] }
http = "1.0"
reqwest = { version = "0.12", features = ["json"] }
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
strsim = "0.11"
scraper = "0.20"
url = "2.5"
sha2 = "0.10"
sha1 = "0.10"
urlencoding = "2.1"
rsa = { version = "0.9", features = ["sha2"] }
bs58 = "0.5"
base64 = "0.22"
solana-sdk = "2.1"
bincode = "1.3"