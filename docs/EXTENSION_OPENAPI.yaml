openapi: 3.1.0
info:
  title: SenseiGuard Extension Backend API
  version: 1.0.0
  summary: Backend contracts for the SenseiGuard extension background service worker
  description: |
    Canonical OpenAPI contract for extension runtime calls.
    This document reflects implemented backend endpoints and compatibility fields.

servers:
  - url: https://senseifi-backend.onrender.com/api
    description: Production
  - url: https://staging.senseifi.com/api
    description: Staging (example)

tags:
  - name: Protection
  - name: Telemetry
  - name: Wallet
  - name: Scanner
  - name: Dashboard

paths:
  /protection/transaction/analyze:
    post:
      tags: [Protection]
      operationId: analyzeTransactionRisk
      summary: Analyze transaction/signing payload risk in real time
      description: |
        Called by SenseiGuard extension worker on intercepted wallet methods.
        Supports extension-style request and legacy to/value/data fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionAnalyzeRequest"
            examples:
              sendTransaction:
                value:
                  method: eth_sendTransaction
                  params:
                    - from: "0x5aAeb6053F3E94C9b9A09f33669435E7Ef1BeAed"
                      to: "0x000000000000000000000000000000000000dead"
                      data: "0x095ea7b30000000000000000000000001234123412341234123412341234123412341234ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff"
                      value: "0x0"
                  url: "https://app.uniswap.org/#/swap"
                  domain: "app.uniswap.org"
                  wallet_address: "0x5aAeb6053F3E94C9b9A09f33669435E7Ef1BeAed"
                  chain_id: 1
                  source: senseiguard_extension
      responses:
        "200":
          description: Risk analysis response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionAnalyzeResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /protection/dapp/connection-check:
    post:
      tags: [Protection]
      operationId: checkDappConnectionRisk
      summary: Crawl and scan dApp website/domain safety
      description: |
        Performs heavyweight website crawling and content/security scan.
        Returns an explicit safety verdict for extension decisioning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DappConnectionCheckRequest"
      responses:
        "200":
          description: dApp/domain risk analysis response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DappConnectionCheckResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /protection/threat-feed:
    get:
      tags: [Protection]
      operationId: getThreatFeed
      summary: Return malicious contracts and domains feed
      description: |
        Intended for extension polling to refresh local heuristics cache.
      responses:
        "200":
          description: Threat feed payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreatFeedResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /protection/domain-threat-feed:
    get:
      tags: [Protection]
      operationId: getDomainThreatFeed
      summary: Return domain threat intelligence feed
      description: |
        Returns malicious domains, trusted allowlist domains, and source metadata.
        Intended for extension sync and local decision cache refresh.
      responses:
        "200":
          description: Domain threat-intel feed payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainThreatFeedResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /telemetry/events:
    post:
      tags: [Telemetry]
      operationId: ingestTelemetryEvents
      summary: Ingest extension telemetry events in batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryBatchRequest"
      responses:
        "200":
          description: Events accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryIngestResponse"
        "202":
          description: Events queued asynchronously (compatibility)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryIngestResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/extension/overview:
    get:
      tags: [Dashboard]
      operationId: getExtensionDashboardOverview
      summary: Get extension dashboard top cards
      parameters:
        - in: query
          name: user_id
          schema:
            type: string
        - in: query
          name: wallet_address
          schema:
            $ref: "#/components/schemas/EvmAddress"
      responses:
        "200":
          description: Extension card metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionDashboardOverviewResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/extension/trade-insights:
    get:
      tags: [Dashboard]
      operationId: getExtensionTradeInsights
      summary: Get extension trade insight table rows
      parameters:
        - in: query
          name: user_id
          schema:
            type: string
        - in: query
          name: wallet_address
          schema:
            $ref: "#/components/schemas/EvmAddress"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: risk_level
          schema:
            type: string
            description: Case-insensitive risk level (e.g. high, medium, critical)
        - in: query
          name: period
          schema:
            type: string
            default: 7d
            description: Relative period in days (examples 7d, 30d, 90d)
      responses:
        "200":
          description: Trade insight table payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionTradeInsightsResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallets/connect:
    post:
      tags: [Wallet]
      operationId: connectWallet
      summary: Register connected wallet session
      description: Called by extension popup and web wallet flow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletConnectRequest"
      responses:
        "200":
          description: Wallet connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletConnectResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Wallet already connected (optional)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scan-contract/:
    post:
      tags: [Scanner]
      operationId: scanContractRisk
      summary: Deep malicious contract/project scan
      description: |
        Performs deeper contract intelligence and returns trust score and risk breakdown.
        Recommended for extension worker when destination contract is unknown or high risk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanContractRequest"
      responses:
        "200":
          description: Contract scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanContractResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    TransactionAnalyzeRequest:
      type: object
      additionalProperties: false
      required:
        - wallet_address
      properties:
        method:
          type: string
          enum:
            - eth_sendTransaction
            - eth_sign
            - eth_signTypedData
            - eth_signTypedData_v3
            - eth_signTypedData_v4
        params:
          type: array
          items:
            oneOf:
              - type: object
                additionalProperties: true
              - type: string
              - type: number
              - type: boolean
              - type: "null"
        url:
          type: string
          format: uri
        domain:
          type: string
        wallet_address:
          $ref: "#/components/schemas/EvmAddress"
        chain_id:
          type: integer
          minimum: 1
        source:
          type: string
          enum: [senseiguard_extension]
        to:
          type: string
        value:
          type: string
        data:
          type: string

    TransactionAnalyzeResponse:
      type: object
      additionalProperties: true
      required:
        - risk_score
        - findings
      properties:
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
          description: CamelCase compatibility field
        findings:
          type: array
          items:
            type: string
        breakdown:
          oneOf:
            - type: object
              additionalProperties:
                oneOf:
                  - type: number
                  - type: string
                  - type: boolean
                  - type: "null"
            - type: "null"
        band:
          type: string
        recommendation:
          type: string
        band:
          type: string
          enum: [Safe, Warning, Dangerous, Block]
        malicious_contract_detected:
          type: boolean
          description: Explicit signal for malicious contract/project detection in worker flow.
        site_safety:
          oneOf:
            - type: string
              enum: [Safe, Warning, Dangerous, Block]
            - type: "null"
          description: Website/domain safety verdict from heavyweight crawl + content/security scan.
        site_safe:
          oneOf:
            - type: boolean
            - type: "null"
          description: Convenience flag for extension UI/decisioning.
        risk_level_10:
          type: number
          format: float
          minimum: 0
          maximum: 10
          description: UI-friendly risk score (0.0-10.0), derived from risk_score.
        reported_incidents:
          type: integer
          minimum: 0
          description: Community-reported incidents linked to the destination contract.
        wallets_drained_estimate:
          type: integer
          minimum: 0
          description: Estimated affected wallet count from observed contract scan trend.
        website_scan:
          oneOf:
            - $ref: "#/components/schemas/WebsiteScanSummary"
            - type: "null"

    DappConnectionCheckRequest:
      type: object
      additionalProperties: false
      required:
        - wallet_address
      properties:
        wallet_address:
          $ref: "#/components/schemas/EvmAddress"
        domain:
          type: string
          description: Domain or hostname to scan (e.g. app.uniswap.org).
        url:
          type: string
          format: uri
          description: Full URL to scan; takes precedence over domain if both provided.
        max_pages:
          type: integer
          minimum: 1
          maximum: 10

    DappConnectionCheckResponse:
      type: object
      additionalProperties: true
      required: [skipped]
      properties:
        skipped:
          type: boolean
        risk_score:
          oneOf:
            - type: integer
              minimum: 0
              maximum: 100
            - type: "null"
        phishing_risk:
          oneOf:
            - type: boolean
            - type: "null"
        safety:
          oneOf:
            - type: string
              enum: [Safe, Warning, Dangerous, Block]
            - type: "null"
        website_scan:
          oneOf:
            - $ref: "#/components/schemas/WebsiteScanSummary"
            - type: "null"
        reason:
          oneOf:
            - type: string
            - type: "null"

    WebsiteScanSummary:
      type: object
      additionalProperties: false
      required:
        - target
        - normalized_url
        - domain
        - safety
        - risk_score
        - crawled_pages
        - issue_count
        - findings
      properties:
        target:
          type: string
        normalized_url:
          type: string
          format: uri
        domain:
          type: string
        safety:
          type: string
          enum: [Safe, Warning, Dangerous, Block]
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
        crawled_pages:
          type: integer
          minimum: 0
        issue_count:
          type: integer
          minimum: 0
        findings:
          type: array
          items:
            type: string

    ThreatFeedResponse:
      type: object
      additionalProperties: false
      required:
        - malicious_contracts
        - malicious_domains
        - trusted_domains
      properties:
        malicious_contracts:
          type: array
          items:
            $ref: "#/components/schemas/EvmAddress"
        malicious_domains:
          type: array
          items:
            type: string
            minLength: 1
        trusted_domains:
          type: array
          items:
            type: string
            minLength: 1
        sources:
          $ref: "#/components/schemas/DomainThreatFeedSources"
        updated_at:
          type: string
          format: date-time

    DomainThreatFeedSources:
      type: object
      additionalProperties: false
      required:
        - from_activity_feed
        - from_env_blocklist
        - static_trusted
      properties:
        from_activity_feed:
          type: integer
          minimum: 0
        from_env_blocklist:
          type: integer
          minimum: 0
        static_trusted:
          type: integer
          minimum: 0

    DomainThreatFeedResponse:
      type: object
      additionalProperties: false
      required:
        - malicious_domains
        - trusted_domains
        - sources
        - updated_at
      properties:
        malicious_domains:
          type: array
          items:
            type: string
            minLength: 1
        trusted_domains:
          type: array
          items:
            type: string
            minLength: 1
        sources:
          $ref: "#/components/schemas/DomainThreatFeedSources"
        updated_at:
          type: string
          format: date-time

    TelemetryBatchRequest:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TelemetryEvent"

    TelemetryEvent:
      type: object
      additionalProperties: true
      required:
        - type
        - at
      properties:
        type:
          type: string
          enum:
            - tx_evaluated
            - tx_blocked
            - tx_warned
            - domain_risk_detected
            - user_decision
            - sync_heartbeat
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
        domain:
          type: string
        method:
          type: string
        findings:
          type: array
          items:
            type: string
        decision:
          type: string
        context:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        at:
          type: string
          format: date-time

    TelemetryIngestResponse:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        accepted:
          type: integer
          minimum: 0
        message:
          type: string

    WalletConnectRequest:
      type: object
      additionalProperties: false
      required:
        - address
        - chain_id
        - wallet_type
      properties:
        address:
          $ref: "#/components/schemas/EvmAddress"
        chain_id:
          type: integer
          minimum: 1
        wallet_type:
          type: string
          enum: [metamask, coinbase]
        user_id:
          type: string

    WalletConnectResponse:
      type: object
      additionalProperties: true
      required:
        - success
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
        dashboard_user:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        message:
          type: string

    ScanContractRequest:
      type: object
      additionalProperties: false
      required: [contract_address]
      properties:
        contract_address:
          $ref: "#/components/schemas/EvmAddress"
        for_address:
          $ref: "#/components/schemas/EvmAddress"
        chain_id:
          type: integer
          minimum: 1

    ScanContractResponse:
      type: object
      additionalProperties: true
      required:
        - scan_id
        - contract_address
        - trust_score
        - critical_risk_flags
        - scanned_at
      properties:
        scan_id:
          type: string
          format: uuid
        contract_address:
          $ref: "#/components/schemas/EvmAddress"
        trust_score:
          type: integer
          minimum: 0
          maximum: 100
        critical_risk_flags:
          type: integer
        token_controlled:
          type: string
        owner_admin_count:
          type: integer
        chain_id:
          type: integer
        network:
          type: string
        contract_name:
          type: string
        detected_standard:
          type: string
        details:
          type: object
          additionalProperties: true
        ai_summary:
          type: string
        scanned_at:
          type: string
          format: date-time

    ExtensionDashboardOverviewResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: false
          required: [cards]
          properties:
            cards:
              type: array
              items:
                $ref: "#/components/schemas/ExtensionMetricCard"

    ExtensionMetricCard:
      type: object
      additionalProperties: false
      required: [key, title, value, this_month]
      properties:
        key:
          type: string
        title:
          type: string
        value:
          type: integer
        this_month:
          type: integer
        trend_percent:
          type: number
          format: float
        status:
          type: string

    ExtensionTradeInsightsResponse:
      type: object
      additionalProperties: false
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/ExtensionTradeInsightItem"
        pagination:
          type: object
          additionalProperties: false
          required: [page, per_page, total, total_pages]
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            total_pages:
              type: integer

    ExtensionTradeInsightItem:
      type: object
      additionalProperties: false
      required:
        - id
        - wallet_or_dapp
        - network
        - activity_type
        - risk_level
        - ai_insight
        - date
      properties:
        id:
          type: string
          format: uuid
        wallet_or_dapp:
          type: string
        network:
          type: string
        activity_type:
          type: string
        risk_level:
          type: string
        ai_insight:
          type: string
        date:
          type: string

    ErrorResponse:
      type: object
      additionalProperties: true
      required:
        - success
      properties:
        success:
          type: boolean
          enum: [false]
        code:
          type: string
        message:
          type: string
        error:
          type: string

    EvmAddress:
      type: string
      pattern: "^0x[a-fA-F0-9]{40}$"
