openapi: 3.1.0
info:
  title: SenseiGuard Extension Backend API
  version: 1.1.0
  summary: Backend contracts for the SenseiGuard extension background service worker
  description: |
    Canonical OpenAPI contract for extension runtime calls.
    This document reflects implemented backend endpoints and compatibility fields.

    **Multi-network wallets:** One `user_id` can own multiple wallet rows (one per unique
    address). Same EVM `0x` address on different EIP-155 chains is still **one row**
    (upsert on `address`; `chain_id` is last-connected chain). EVM + Solana = two rows.
    Use `GET /wallets?user_id=` for the Connected networks panel.

servers:
  - url: https://senseifi-backend.onrender.com/api
    description: Production
  - url: https://staging.senseifi.com/api
    description: Staging (example)

tags:
  - name: Protection
  - name: Telemetry
  - name: Wallet
  - name: Scanner
  - name: Dashboard
  - name: Billing

paths:
  /protection/transaction/analyze:
    post:
      tags: [Protection]
      operationId: analyzeTransactionRisk
      summary: Analyze transaction/signing payload risk in real time
      description: |
        Called by SenseiGuard extension worker on intercepted wallet methods.
        Supports extension-style request and legacy to/value/data fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionAnalyzeRequest"
            examples:
              sendTransaction:
                value:
                  method: eth_sendTransaction
                  params:
                    - from: "0x5aAeb6053F3E94C9b9A09f33669435E7Ef1BeAed"
                      to: "0x000000000000000000000000000000000000dead"
                      data: "0x095ea7b30000000000000000000000001234123412341234123412341234123412341234ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff"
                      value: "0x0"
                  url: "https://app.uniswap.org/#/swap"
                  domain: "app.uniswap.org"
                  wallet_address: "0x5aAeb6053F3E94C9b9A09f33669435E7Ef1BeAed"
                  chain_id: 1
                  source: senseiguard_extension
      responses:
        "200":
          description: Risk analysis response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionAnalyzeResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /protection/dapp/connection-check:
    post:
      tags: [Protection]
      operationId: checkDappConnectionRisk
      summary: Crawl and scan dApp website/domain safety
      description: |
        Performs heavyweight website crawling and content/security scan.
        Returns an explicit safety verdict for extension decisioning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DappConnectionCheckRequest"
      responses:
        "200":
          description: dApp/domain risk analysis response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DappConnectionCheckResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /protection/threat-feed:
    get:
      tags: [Protection]
      operationId: getThreatFeed
      summary: Return malicious contracts and domains feed
      description: |
        Intended for extension polling to refresh local heuristics cache.
      responses:
        "200":
          description: Threat feed payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreatFeedResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /protection/domain-threat-feed:
    get:
      tags: [Protection]
      operationId: getDomainThreatFeed
      summary: Return domain threat intelligence feed
      description: |
        Returns malicious domains, trusted allowlist domains, and source metadata.
        Intended for extension sync and local decision cache refresh.
      responses:
        "200":
          description: Domain threat-intel feed payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainThreatFeedResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /telemetry/events:
    post:
      tags: [Telemetry]
      operationId: ingestTelemetryEvents
      summary: Ingest extension telemetry events in batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryBatchRequest"
      responses:
        "200":
          description: Events accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryIngestResponse"
        "202":
          description: Events queued asynchronously (compatibility)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryIngestResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/extension/overview:
    get:
      tags: [Dashboard]
      operationId: getExtensionDashboardOverview
      summary: Get extension dashboard top cards
      parameters:
        - in: query
          name: user_id
          schema:
            type: string
        - in: query
          name: wallet_address
          schema:
            $ref: "#/components/schemas/EvmAddress"
      responses:
        "200":
          description: Extension card metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionDashboardOverviewResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/extension/trade-insights:
    get:
      tags: [Dashboard]
      operationId: getExtensionTradeInsights
      summary: Get extension trade insight table rows
      parameters:
        - in: query
          name: user_id
          schema:
            type: string
        - in: query
          name: wallet_address
          schema:
            $ref: "#/components/schemas/EvmAddress"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: risk_level
          schema:
            type: string
            description: Case-insensitive risk level (e.g. high, medium, critical)
        - in: query
          name: period
          schema:
            type: string
            default: 7d
            description: Relative period in days (examples 7d, 30d, 90d)
      responses:
        "200":
          description: Trade insight table payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionTradeInsightsResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallets:
    get:
      tags: [Wallet]
      operationId: listConnectedWallets
      summary: List connected wallets (one address or all networks for a user)
      description: |
        **Connected networks UI:** use `user_id` to return all active wallets (EVM + Solana).

        `for_address` returns at most one row for that address (legacy / active-account scope).
        One of `user_id` or `for_address` is required.
      parameters:
        - in: query
          name: user_id
          schema:
            type: string
          description: Dashboard user id from connect response. Lists all connected networks.
        - in: query
          name: for_address
          schema:
            $ref: "#/components/schemas/DashboardWalletAddress"
          description: Single-wallet lookup by address (0 or 1 row).
      responses:
        "200":
          description: Connected wallet list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectedWalletListResponse"
              examples:
                evmAndSolana:
                  summary: One user with Ethereum + Solana
                  value:
                    success: true
                    data:
                      - id: "a1111111-1111-4111-8111-111111111111"
                        address: "0xb5311dc5d23cb2ea942feca4c7880a111795d494"
                        provider: "WalletConnect"
                        chain_family: "evm"
                        chain_id: 1
                        currency: "Ethereum"
                        network: null
                        network_label: "Ethereum"
                        connected_at: "2026-03-14T10:00:00Z"
                      - id: "b2222222-2222-4222-8222-222222222222"
                        address: "7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU"
                        provider: "Phantom"
                        chain_family: "solana"
                        chain_id: 101
                        currency: "Solana"
                        network: "mainnet"
                        network_label: "Solana"
                        connected_at: "2026-03-14T10:05:00Z"
                    pagination:
                      page: 1
                      per_page: 2
                      total: 2
        "400":
          description: Missing user_id/for_address or invalid address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallets/connect:
    post:
      tags: [Wallet]
      operationId: connectWallet
      summary: Register or refresh a connected wallet (upsert by address)
      description: |
        Called by extension popup and web wallet flow.

        **Upsert:** `address` is unique. Re-connecting the same address updates metadata
        (`chain_id`, `wallet_type`, `user_id`, etc.).

        **Multi-network:** Pass the same `user_id` on every connect, or use
        `link_wallet_address` when adding Solana after EVM (or vice versa).

        **EVM WalletConnect:** `wallet_type` must be `walletconnect`. Optional
        `wallet_provider` / `wallet_name` carry the underlying app (e.g. Trust Wallet).

        **Solana:** `chain_family: solana`, `wallet_type` one of `phantom` | `solflare` |
        `backpack`. Server stores `chain_id: 101` regardless of body `chain_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletConnectRequest"
            examples:
              evmWalletConnect:
                summary: EVM via WalletConnect (Ethereum mainnet)
                value:
                  address: "0xb5311dc5d23cb2ea942feca4c7880a111795d494"
                  chain_id: 1
                  chain_family: evm
                  wallet_type: walletconnect
                  wallet_provider: trustwallet
                  wallet_name: "Trust Wallet"
              solanaPhantomLinked:
                summary: Solana Phantom linked to existing EVM wallet
                value:
                  address: "7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU"
                  chain_id: 101
                  chain_family: solana
                  wallet_type: phantom
                  wallet_provider: phantom
                  network: mainnet-beta
                  link_wallet_address: "0xb5311dc5d23cb2ea942feca4c7880a111795d494"
              solanaPhantomWithUserId:
                summary: Solana with explicit user_id (preferred)
                value:
                  address: "7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU"
                  chain_id: 101
                  chain_family: solana
                  wallet_type: phantom
                  network: mainnet-beta
                  user_id: "fetrtwgebejhss"
      responses:
        "200":
          description: Wallet connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletConnectResponse"
              examples:
                evmConnect:
                  summary: EVM connect response (save dashboard_user.user_id)
                  value:
                    success: true
                    data:
                      id: "a1111111-1111-4111-8111-111111111111"
                      address: "0xb5311dc5d23cb2ea942feca4c7880a111795d494"
                      chain_id: 1
                      chain_family: evm
                      wallet_type: walletconnect
                      wallet_provider: trustwallet
                      wallet_name: "Trust Wallet"
                      provider_display: "Trust Wallet"
                      network: null
                      network_label: "Ethereum"
                      connected_at: "2026-03-14T10:00:00Z"
                      is_active: true
                    dashboard_user:
                      user_id: "fetrtwgebejhss"
                      display_name: "Stealth bag"
                      user_number: 2314
                      user_label: "User 2314"
                solanaConnect:
                  summary: Solana connect (same user_id as EVM)
                  value:
                    success: true
                    data:
                      id: "b2222222-2222-4222-8222-222222222222"
                      address: "7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU"
                      chain_id: 101
                      chain_family: solana
                      wallet_type: phantom
                      wallet_provider: phantom
                      wallet_name: null
                      provider_display: "Phantom"
                      network: mainnet
                      network_label: "Solana"
                      connected_at: "2026-03-14T10:05:00Z"
                      is_active: true
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Wallet already connected (optional)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

                $ref: "#/components/schemas/ErrorResponse"

  /wallets/{address}:
    get:
      tags: [Wallet]
      operationId: getWallet
      summary: Get one connected wallet by address
      parameters:
        - name: address
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DashboardWalletAddress"
      responses:
        "200":
          description: Wallet row
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/WalletData"
        "404":
          description: Wallet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Wallet]
      operationId: disconnectWallet
      summary: Disconnect one wallet (EVM or Solana)
      description: Sets `is_active=false` for this address only. Other networks under the same user_id remain active.
      parameters:
        - name: address
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DashboardWalletAddress"
      responses:
        "200":
          description: Wallet disconnected
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "404":
          description: Wallet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/{address}/assets/sync:
    post:
      tags: [Dashboard]
      operationId: syncWalletAssets
      summary: Sync wallet token balances (EVM or Solana)
      description: |
        EVM: Moralis ERC-20/BEP-20 per configured chain IDs.
        Solana: Moralis native SOL + SPL on chain_id 101 using the wallet's stored network.
        Requires MORALIS_API_KEY. Call after Solana connect to populate wallet_assets.
      parameters:
        - name: address
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DashboardWalletAddress"
      responses:
        "200":
          description: Sync completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetSyncResponse"
        "400":
          description: Invalid address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Wallet not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: MORALIS_API_KEY not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/{address}/assets:
    get:
      tags: [Dashboard]
      operationId: listWalletAssets
      summary: List wallet assets (EVM or Solana)
      parameters:
        - name: address
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DashboardWalletAddress"
      responses:
        "200":
          description: Asset list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetListResponse"
        "400":
          description: Invalid address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/{address}/summary:
    get:
      tags: [Dashboard]
      operationId: getDashboardSummary
      summary: Wallet dashboard summary (EVM or Solana)
      parameters:
        - name: address
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DashboardWalletAddress"
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummaryResponse"
        "400":
          description: Invalid address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallets/{address}/modal:
    get:
      tags: [Wallet]
      operationId: getConnectedWalletModal
      summary: Connected wallet modal data (EVM or Solana)
      parameters:
        - name: address
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/DashboardWalletAddress"
      responses:
        "200":
          description: Modal payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletModalResponse"
        "400":
          description: Invalid address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scan-contract/:
    post:
      tags: [Scanner]
      operationId: scanContractRisk
      summary: Deep malicious contract/project scan
      description: |
        Performs deeper contract intelligence and returns trust score and risk breakdown.
        Recommended for extension worker when destination contract is unknown or high risk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanContractRequest"
      responses:
        "200":
          description: Contract scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanContractResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    TransactionAnalyzeRequest:
      type: object
      additionalProperties: false
      required:
        - wallet_address
      properties:
        method:
          type: string
          enum:
            - eth_sendTransaction
            - eth_sign
            - eth_signTypedData
            - eth_signTypedData_v3
            - eth_signTypedData_v4
        params:
          type: array
          items:
            oneOf:
              - type: object
                additionalProperties: true
              - type: string
              - type: number
              - type: boolean
              - type: "null"
        url:
          type: string
          format: uri
        domain:
          type: string
        wallet_address:
          $ref: "#/components/schemas/EvmAddress"
        chain_id:
          type: integer
          minimum: 1
        source:
          type: string
          enum: [senseiguard_extension]
        to:
          type: string
        value:
          type: string
        data:
          type: string

    TransactionAnalyzeResponse:
      type: object
      additionalProperties: true
      required:
        - risk_score
        - findings
      properties:
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
          description: CamelCase compatibility field
        findings:
          type: array
          items:
            type: string
        breakdown:
          oneOf:
            - type: object
              additionalProperties:
                oneOf:
                  - type: number
                  - type: string
                  - type: boolean
                  - type: "null"
            - type: "null"
        band:
          type: string
        recommendation:
          type: string
        band:
          type: string
          enum: [Safe, Warning, Dangerous, Block]
        malicious_contract_detected:
          type: boolean
          description: Explicit signal for malicious contract/project detection in worker flow.
        site_safety:
          oneOf:
            - type: string
              enum: [Safe, Warning, Dangerous, Block]
            - type: "null"
          description: Website/domain safety verdict from heavyweight crawl + content/security scan.
        site_safe:
          oneOf:
            - type: boolean
            - type: "null"
          description: Convenience flag for extension UI/decisioning.
        risk_level_10:
          type: number
          format: float
          minimum: 0
          maximum: 10
          description: UI-friendly risk score (0.0-10.0), derived from risk_score.
        reported_incidents:
          type: integer
          minimum: 0
          description: Community-reported incidents linked to the destination contract.
        wallets_drained_estimate:
          type: integer
          minimum: 0
          description: Estimated affected wallet count from observed contract scan trend.
        website_scan:
          oneOf:
            - $ref: "#/components/schemas/WebsiteScanSummary"
            - type: "null"

    DappConnectionCheckRequest:
      type: object
      additionalProperties: false
      required:
        - wallet_address
      properties:
        wallet_address:
          $ref: "#/components/schemas/EvmAddress"
        domain:
          type: string
          description: Domain or hostname to scan (e.g. app.uniswap.org).
        url:
          type: string
          format: uri
          description: Full URL to scan; takes precedence over domain if both provided.
        max_pages:
          type: integer
          minimum: 1
          maximum: 10

    DappConnectionCheckResponse:
      type: object
      additionalProperties: true
      required: [skipped]
      properties:
        skipped:
          type: boolean
        risk_score:
          oneOf:
            - type: integer
              minimum: 0
              maximum: 100
            - type: "null"
        phishing_risk:
          oneOf:
            - type: boolean
            - type: "null"
        safety:
          oneOf:
            - type: string
              enum: [Safe, Warning, Dangerous, Block]
            - type: "null"
        website_scan:
          oneOf:
            - $ref: "#/components/schemas/WebsiteScanSummary"
            - type: "null"
        reason:
          oneOf:
            - type: string
            - type: "null"

    WebsiteScanSummary:
      type: object
      additionalProperties: false
      required:
        - target
        - normalized_url
        - domain
        - safety
        - risk_score
        - crawled_pages
        - issue_count
        - findings
      properties:
        target:
          type: string
        normalized_url:
          type: string
          format: uri
        domain:
          type: string
        safety:
          type: string
          enum: [Safe, Warning, Dangerous, Block]
        risk_score:
          type: integer
          minimum: 0
          maximum: 100
        crawled_pages:
          type: integer
          minimum: 0
        issue_count:
          type: integer
          minimum: 0
        findings:
          type: array
          items:
            type: string

    ThreatFeedResponse:
      type: object
      additionalProperties: false
      required:
        - malicious_contracts
        - malicious_domains
        - trusted_domains
      properties:
        malicious_contracts:
          type: array
          items:
            $ref: "#/components/schemas/EvmAddress"
        malicious_domains:
          type: array
          items:
            type: string
            minLength: 1
        trusted_domains:
          type: array
          items:
            type: string
            minLength: 1
        sources:
          $ref: "#/components/schemas/DomainThreatFeedSources"
        updated_at:
          type: string
          format: date-time

    DomainThreatFeedSources:
      type: object
      additionalProperties: false
      required:
        - from_activity_feed
        - from_env_blocklist
        - static_trusted
      properties:
        from_activity_feed:
          type: integer
          minimum: 0
        from_env_blocklist:
          type: integer
          minimum: 0
        static_trusted:
          type: integer
          minimum: 0

    DomainThreatFeedResponse:
      type: object
      additionalProperties: false
      required:
        - malicious_domains
        - trusted_domains
        - sources
        - updated_at
      properties:
        malicious_domains:
          type: array
          items:
            type: string
            minLength: 1
        trusted_domains:
          type: array
          items:
            type: string
            minLength: 1
        sources:
          $ref: "#/components/schemas/DomainThreatFeedSources"
        updated_at:
          type: string
          format: date-time

    TelemetryBatchRequest:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TelemetryEvent"

    TelemetryEvent:
      type: object
      additionalProperties: true
      required:
        - type
        - at
      properties:
        type:
          type: string
          enum:
            - tx_evaluated
            - tx_blocked
            - tx_warned
            - domain_risk_detected
            - user_decision
            - sync_heartbeat
        riskScore:
          type: integer
          minimum: 0
          maximum: 100
        domain:
          type: string
        method:
          type: string
        findings:
          type: array
          items:
            type: string
        decision:
          type: string
        context:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        at:
          type: string
          format: date-time

    TelemetryIngestResponse:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        accepted:
          type: integer
          minimum: 0
        message:
          type: string

    WalletConnectRequest:
      type: object
      additionalProperties: false
      required:
        - address
        - chain_id
        - wallet_type
      properties:
        address:
          description: EVM (0x…) or Solana (base58) pubkey depending on chain_family.
          oneOf:
            - $ref: "#/components/schemas/EvmAddress"
            - $ref: "#/components/schemas/SolanaAddress"
        chain_id:
          type: integer
          minimum: 1
          description: EVM chain ID (e.g. 1, 56) or 101 for Solana.
        chain_family:
          type: string
          enum: [evm, solana]
          default: evm
          description: Chain family. Defaults to evm for backward compatibility.
        network:
          type: string
          description: |
            Solana cluster from the client (e.g. mainnet-beta, devnet).
            Normalized to mainnet or devnet and stored on the wallet row. Ignored for EVM.
          enum: [mainnet, mainnet-beta, devnet]
        wallet_type:
          type: string
          description: Connection method or Solana wallet app slug.
          enum: [metamask, coinbase, trustwallet, trust, walletconnect, binance, phantom, solflare, backpack]
        wallet_provider:
          type: string
          description: Wallet app slug from WalletConnect session metadata (e.g. trustwallet, rainbow). Optional for walletconnect; auto-set for direct connects.
          pattern: '^[a-z0-9_-]{2,32}$'
        wallet_name:
          type: string
          description: Human-readable wallet label from the client (e.g. Trust Wallet).
          maxLength: 64
        user_id:
          type: string
          description: |
            Dashboard user id. Reuse the same value when connecting additional networks.
            If omitted, backend may create a new dashboard user per address unless
            `link_wallet_address` resolves an existing user.
        link_wallet_address:
          description: |
            When adding a second network, inherit `user_id` from this already-connected
            wallet (EVM or Solana). Alternative to passing `user_id` directly.
          oneOf:
            - $ref: "#/components/schemas/EvmAddress"
            - $ref: "#/components/schemas/SolanaAddress"

    WalletData:
      type: object
      additionalProperties: false
      required:
        - id
        - address
        - chain_id
        - chain_family
        - wallet_type
        - provider_display
        - network_label
        - connected_at
        - is_active
      properties:
        id:
          type: string
          format: uuid
        address:
          oneOf:
            - $ref: "#/components/schemas/EvmAddress"
            - $ref: "#/components/schemas/SolanaAddress"
        chain_id:
          type: integer
          description: EIP-155 chain id for EVM; always 101 for Solana rows.
        chain_family:
          type: string
          enum: [evm, solana]
        wallet_type:
          type: string
          description: |
            EVM connection method (`walletconnect`, `metamask`, …) or Solana app slug
            (`phantom`, `solflare`, `backpack`).
        wallet_provider:
          type: string
          nullable: true
        wallet_name:
          type: string
          nullable: true
        provider_display:
          type: string
          description: UI label (prefers wallet_name, then provider, then wallet_type).
        network:
          type: string
          nullable: true
          description: Solana cluster (`mainnet` | `devnet`). Null for EVM.
        network_label:
          type: string
          description: Human-readable network for UI (e.g. Ethereum, Solana).
        connected_at:
          type: string
          format: date-time
        is_active:
          type: boolean

    DashboardUser:
      type: object
      additionalProperties: false
      required: [user_id, display_name, user_number, user_label]
      properties:
        user_id:
          type: string
          description: Persist in frontend after first connect; pass on subsequent connects.
        display_name:
          type: string
        user_number:
          type: integer
        user_label:
          type: string
          description: e.g. "User 2314"

    ConnectedWalletItem:
      type: object
      additionalProperties: false
      required:
        - id
        - address
        - provider
        - chain_family
        - chain_id
        - currency
        - network_label
        - connected_at
      properties:
        id:
          type: string
          format: uuid
        address:
          oneOf:
            - $ref: "#/components/schemas/EvmAddress"
            - $ref: "#/components/schemas/SolanaAddress"
        provider:
          type: string
          description: Same as WalletData.provider_display.
        chain_family:
          type: string
          enum: [evm, solana]
        chain_id:
          type: integer
        currency:
          type: string
          description: Network label (duplicate of network_label for backward compatibility).
        network:
          type: string
          nullable: true
        network_label:
          type: string
        connected_at:
          type: string
          format: date-time

    ConnectedWalletListResponse:
      type: object
      additionalProperties: false
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/ConnectedWalletItem"
        pagination:
          type: object
          additionalProperties: false
          required: [page, per_page, total]
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer

    WalletConnectResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - data
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/WalletData"
        dashboard_user:
          oneOf:
            - $ref: "#/components/schemas/DashboardUser"
            - type: "null"
          description: |
            Present when backend created or resolved dashboard identity on connect.
            Store `user_id` client-side for multi-network listing and overview APIs.
        message:
          type: string

    ScanContractRequest:
      type: object
      additionalProperties: false
      required: [contract_address]
      properties:
        contract_address:
          description: EVM contract (0x…) or Solana program ID (base58).
          oneOf:
            - $ref: "#/components/schemas/EvmAddress"
            - $ref: "#/components/schemas/SolanaAddress"
        for_address:
          description: Billing / scan-history wallet (EVM or Solana).
          oneOf:
            - $ref: "#/components/schemas/EvmAddress"
            - $ref: "#/components/schemas/SolanaAddress"
        chain_id:
          type: integer
          minimum: 1
          description: EVM chain id; 101 convention for Solana.
        chain_family:
          type: string
          enum: [evm, solana]
          description: Auto-detected from address when omitted.
        network:
          type: string
          enum: [mainnet, mainnet-beta, devnet]
          description: Solana cluster (informational in scan response).

    ScanContractResponse:
      type: object
      additionalProperties: true
      required:
        - scan_id
        - contract_address
        - trust_score
        - critical_risk_flags
        - scanned_at
      properties:
        scan_id:
          type: string
          format: uuid
        contract_address:
          $ref: "#/components/schemas/EvmAddress"
        trust_score:
          type: integer
          minimum: 0
          maximum: 100
        critical_risk_flags:
          type: integer
        token_controlled:
          type: string
        owner_admin_count:
          type: integer
        chain_id:
          type: integer
        network:
          type: string
        contract_name:
          type: string
        detected_standard:
          type: string
        details:
          type: object
          additionalProperties: true
        ai_summary:
          type: string
        scanned_at:
          type: string
          format: date-time

    ExtensionDashboardOverviewResponse:
      type: object
      additionalProperties: false
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: false
          required: [cards]
          properties:
            cards:
              type: array
              items:
                $ref: "#/components/schemas/ExtensionMetricCard"

    ExtensionMetricCard:
      type: object
      additionalProperties: false
      required: [key, title, value, this_month]
      properties:
        key:
          type: string
        title:
          type: string
        value:
          type: integer
        this_month:
          type: integer
        trend_percent:
          type: number
          format: float
        status:
          type: string

    ExtensionTradeInsightsResponse:
      type: object
      additionalProperties: false
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/ExtensionTradeInsightItem"
        pagination:
          type: object
          additionalProperties: false
          required: [page, per_page, total, total_pages]
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            total_pages:
              type: integer

    ExtensionTradeInsightItem:
      type: object
      additionalProperties: false
      required:
        - id
        - wallet_or_dapp
        - network
        - activity_type
        - risk_level
        - ai_insight
        - date
      properties:
        id:
          type: string
          format: uuid
        wallet_or_dapp:
          type: string
        network:
          type: string
        activity_type:
          type: string
        risk_level:
          type: string
        ai_insight:
          type: string
        date:
          type: string

    BillingHistoryResponse:
      type: object
      additionalProperties: false
      required: [success, data, pagination]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/BillingHistoryItem"
        pagination:
          type: object
          additionalProperties: false
          required: [page, per_page, total, total_pages]
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            total_pages:
              type: integer

    BillingHistoryItem:
      type: object
      additionalProperties: false
      required:
        - id
        - plan_name
        - amount
        - currency
        - purchase_date
        - end_date
        - status
      properties:
        id:
          type: string
          format: uuid
        plan_name:
          type: string
        amount:
          type: string
        currency:
          type: string
        purchase_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          type: string
        action_url:
          type: string
          format: uri

    ErrorResponse:
      type: object
      additionalProperties: true
      required:
        - success
      properties:
        success:
          type: boolean
          enum: [false]
        code:
          type: string
        message:
          type: string
        error:
          type: string

    EvmAddress:
      type: string
      pattern: "^0x[a-fA-F0-9]{40}$"

    SolanaAddress:
      type: string
      description: Solana base58-encoded 32-byte public key (32–44 characters).
      minLength: 32
      maxLength: 44
      pattern: "^[1-9A-HJ-NP-Za-km-z]{32,44}$"

    DashboardWalletAddress:
      description: EVM or Solana address accepted by asset/sync/summary/modal routes.
      oneOf:
        - $ref: "#/components/schemas/EvmAddress"
        - $ref: "#/components/schemas/SolanaAddress"

    AssetSyncChainOutcome:
      type: object
      additionalProperties: true
      required: [chain_id, status, tokens_upserted]
      properties:
        chain_id:
          type: integer
        status:
          type: string
          enum: [ok, skipped, error]
        tokens_upserted:
          type: integer
          minimum: 0
        detail:
          type: string

    AssetSyncResponse:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            chains:
              type: array
              items:
                $ref: "#/components/schemas/AssetSyncChainOutcome"

    AssetListResponse:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
            additionalProperties: true

    DashboardSummaryResponse:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true

    WalletModalResponse:
      type: object
      additionalProperties: true
      required: [success]
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties: true
